<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

/* 顶栏 */

.burger{display:none;font-size:1.5rem;background:none;border:none;color:var(--accent);cursor:pointer}

/* Hero 电视屏幕 */
.hero{max-width:1180px;margin:2.4rem auto;padding:0 1.2rem}
.tv-frame{
  position:relative;border:8px solid #2a2a2a;border-radius:22px 22px 30px 30px;
  background:#000;padding:1.2rem;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 30px rgba(120,255,120,.05);
}
.tv-frame::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:60px;height:4px;background:#333;border-radius:2px}
.tv-frame::after{content:"POWER";position:absolute;bottom:10px;right:20px;font-size:.6rem;color:#555;letter-spacing:2px}
.screen{
  position:relative;border-radius:12px;overflow:hidden;
  background:
    repeating-linear-gradient(0deg,transparent 0 2px,rgba(120,255,120,.03) 2px 3px),
    radial-gradient(ellipse at center,rgba(20,60,20,.8),#000);
  padding:2.8rem 2rem;text-align:center;
}
.snow{position:absolute;inset:0;opacity:.06;pointer-events:none;
  background:radial-gradient(circle at 20% 50%,#fff 1px,transparent 1px),
              radial-gradient(circle at 60% 30%,#fff 1px,transparent 1px),
              radial-gradient(circle at 80% 70%,#fff 1px,transparent 1px),
              radial-gradient(circle at 40% 80%,#fff 1px,transparent 1px);
  background-size:8px 8px;animation:snow 1s steps(4) infinite;
}
@keyframes snow{0%{transform:translate(0,0)}25%{transform:translate(-2px,2px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(1px,1px)}}
.kicker{position:relative;font-size:.7rem;letter-spacing:3px;color:var(--accent);border:1px solid rgba(120,255,120,.3);padding:.15rem .6rem;border-radius:4px;font-family:monospace}
.screen h1{position:relative;font-size:2rem;margin:.8rem 0 .5rem;color:#e0e0e0}
.screen h1 span{color:var(--accent);text-shadow:0 0 10px rgba(124,255,124,.3)}
.screen p{position:relative;max-width:620px;margin:0 auto;color:#9ec89e}
.cta{position:relative;margin-top:1.4rem;display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.btn{padding:.7rem 1.6rem;border-radius:6px;font-weight:700;font-size:.88rem;transition:all .3s;font-family:monospace}
.btn-main{background:var(--accent);color:#0a1a0a}
.btn-main:hover{background:#5cff5c;transform:translateY(-2px)}
.btn-ghost{border:1px solid rgba(120,255,120,.3);color:var(--accent)}
.btn-ghost:hover{background:rgba(120,255,120,.1)}

.sec-head{display:flex;align-items:baseline;gap:.6rem;margin-bottom:1.1rem}
